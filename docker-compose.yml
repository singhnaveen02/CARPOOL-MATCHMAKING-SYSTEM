version: "3.9"

services:
  postgres:
    image: postgres:15-postgis
    container_name: carpool-postgres
    environment:
      POSTGRES_USER: carpool_user
      POSTGRES_PASSWORD: carpool_password
      POSTGRES_DB: carpool_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carpool_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carpool-network

  backend:
    build:
      context: ./carpool-backend
      dockerfile: Dockerfile
    container_name: carpool-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://carpool_user:carpool_password@postgres:5432/carpool_db
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OSRM_API_URL: https://router.project-osrm.org
      DEBUG: "True"
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./carpool-backend:/app
    networks:
      - carpool-network

  frontend:
    build:
      context: ./carpool-frontend
      dockerfile: Dockerfile
    container_name: carpool-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    volumes:
      - ./carpool-frontend:/app
      - /app/node_modules
    networks:
      - carpool-network

volumes:
  postgres_data:

networks:
  carpool-network:
    driver: bridge
